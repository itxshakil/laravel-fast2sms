name-template: "v$NEXT_PATCH_VERSION"
tag-template: "v$NEXT_PATCH_VERSION"

categories:
    - title: "🚀 New Features"
      labels:
          - feature
          - core
          - http
          - notifications
          - queue
          - config

    - title: "🐛 Bug Fixes"
      labels:
          - bug
          - fix

    - title: "🧪 Tests"
      labels:
          - tests

    - title: "🔧 CI / Tooling"
      labels:
          - ci
          - tooling

    - title: "⬆️ Dependencies"
      labels:
          - dependencies

    - title: "📚 Documentation"
      labels:
          - docs
          - documentation

    - title: "🧹 Maintenance"
      labels:
          - meta

    - title: "⚠️ Breaking Changes"
      labels:
          - breaking-change

change-template: "- $TITLE (#$NUMBER) @$AUTHOR"

template: |
    ## Changes

    $CHANGES

exclude:
    labels:
        - skip-changelog
