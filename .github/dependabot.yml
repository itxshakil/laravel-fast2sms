version: 2

updates:
  - package-ecosystem: composer
    directory: /
    # Widen ranges instead of replacing them, or a major bump drops support for older PHP.
    versioning-strategy: widen
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - ci
