name: CI

on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

# All jobs run in parallel; nothing waits on lint or static analysis.
# Dependency installs are cached per OS/PHP/strategy by ramsey/composer-install.
jobs:
    lint:
        name: Lint (Pint)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  tools: composer
                  coverage: none

            - uses: ramsey/composer-install@v3

            - run: vendor/bin/pint --test

            - name: Lint GitHub Actions workflows
              uses: raven-actions/actionlint@v2

    analyse:
        name: Static Analysis (PHPStan)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  tools: composer
                  coverage: none

            - uses: ramsey/composer-install@v3

            - run: php -d memory_limit=1G vendor/bin/phpstan analyse

    packagist:
        name: Composer / Packagist Validation
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  tools: composer
                  coverage: none

            - run: composer validate --strict
            - run: composer dump-autoload --dry-run --optimize

    test:
        name: Tests (PHP ${{ matrix.php }} | ${{ matrix.os }} | ${{ matrix.deps }})
        runs-on: ${{ matrix.os }}

        # Full PHP x dependency matrix on Linux; macOS and Windows only on the
        # oldest and newest PHP with stable dependencies. Keeps macOS jobs under
        # the free-plan concurrency limit so none of them queue.
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest]
                php: [8.3, 8.4, 8.5]
                deps: [lowest, highest]
                include:
                    - { os: macos-latest, php: 8.3, deps: highest }
                    - { os: macos-latest, php: 8.5, deps: highest }
                    - { os: windows-latest, php: 8.3, deps: highest }
                    - { os: windows-latest, php: 8.5, deps: highest }

        steps:
            - uses: actions/checkout@v7

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, mbstring, zip, fileinfo, pdo_sqlite, sqlite3
                  tools: composer
                  coverage: none

            - uses: ramsey/composer-install@v3
              with:
                  dependency-versions: ${{ matrix.deps }}

            - run: vendor/bin/phpunit
