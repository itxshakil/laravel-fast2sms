name: CI

on:
    push:
        branches-ignore: ["main"]
    pull_request:
        branches: ["main"]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    lint:
        name: Lint (Pint)
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  tools: composer
                  coverage: none

            - uses: actions/cache@v5
              with:
                  path: ~/.composer/cache
                  key: pint-${{ hashFiles('composer.json') }}
                  restore-keys: pint-

            - run: composer install --no-interaction --prefer-dist
            - run: vendor/bin/pint --test

    analyse:
        name: Static Analysis (PHPStan)
        runs-on: ubuntu-latest
        needs: lint

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  tools: composer
                  coverage: none

            - uses: actions/cache@v5
              with:
                  path: ~/.composer/cache
                  key: phpstan-${{ hashFiles('composer.json') }}
                  restore-keys: phpstan-

            - run: composer install --no-interaction --prefer-dist
            - run: php -d memory_limit=1G vendor/bin/phpstan analyse

    test:
        name: Tests (PHP ${{ matrix.php }} | ${{ matrix.os }} | ${{ matrix.deps }})
        runs-on: ${{ matrix.os }}
        needs: analyse

        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
                php: [8.3, 8.4, 8.5]
                deps: [prefer-lowest, prefer-stable]
            include:
                - php: 8.5
                  experimental: true
            exclude: []

        continue-on-error: ${{ matrix.experimental == true }}

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, mbstring, zip, fileinfo
                  tools: composer
                  coverage: none

            - uses: actions/cache@v5
              with:
                  path: ~/.composer/cache
                  key: test-${{ matrix.php }}-${{ matrix.os }}-${{ matrix.deps }}-${{ hashFiles('composer.json') }}
                  restore-keys: |
                      test-${{ matrix.php }}-${{ matrix.os }}-${{ matrix.deps }}-
                      test-${{ matrix.php }}-${{ matrix.os }}-

            - run: composer update --${{ matrix.deps }} --no-interaction --prefer-dist
            - run: vendor/bin/phpunit

    packagist:
        name: Composer / Packagist Validation
        runs-on: ubuntu-latest
        needs: lint

        steps:
            - uses: actions/checkout@v4

            - uses: shivammathur/setup-php@v2
              with:
                  php-version: 8.3
                  tools: composer
                  coverage: none

            - uses: actions/cache@v5
              with:
                  path: ~/.composer/cache
                  key: packagist-${{ hashFiles('composer.json') }}
                  restore-keys: packagist-

            - run: composer validate --strict
            - run: composer dump-autoload --dry-run --optimize
